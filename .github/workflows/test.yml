name: CI

on: [push, pull_request]

jobs:
  build:

    runs-on: macOS-latest
    
    steps:
    - uses: actions/checkout@master
    - name: Start xcodebuild test
      # Current SDKs require macOS 12+ for CI builds. Keep the project's
      # deployment target unchanged for developers using older toolchains.
      run: xcodebuild clean build -project BLEUnlock.xcodeproj -scheme BLEUnlock MACOSX_DEPLOYMENT_TARGET=12.0 CODE_SIGNING_ALLOWED=NO
